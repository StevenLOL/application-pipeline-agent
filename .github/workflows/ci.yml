# APA CI (D6 / F4 evaluation gate)
#
# Exposure discipline (user directive 2026-10-18): this repo has no git remote;
# configuring a remote and the first push are exposure decisions to be made
# explicitly by the user. The workflow is archived on write; CI status is
# "not run" until it is actually triggered.
#
# Three gates (all locally deterministic, zero external dependencies, zero
# accounts, zero network):
#   1. Semantic gate (DeepEval 4.3.1 FaithfulnessMetric, replay judge) — catches
#      semantic-level defects that literal rules miss (incident-4 type: JD
#      checklist action items with no JD basis)
#   2. Rule regression (F1 engine + _130 inheritance + A2/A4/A5 + F10 three rules)
#   3. Golden set (4 numbered incident version pairs + 1 proposal-doc rule +
#      INC-2026-1016 replay)
#
# Environment: Python 3.11 (same as conda env apa, docs/09 §7).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (dev + eval extras)
        run: pip install -e ".[dev,eval]"

      # Semantic gate: deepeval CLI entrypoint (DeepEval is officially Pytest-native).
      # Exit-code semantics verified locally: all-green exits 0; a broken verdict
      # (sem-001 verdicts changed to yes) exits 1.
      # Judge defaults to replay (deterministic, CI-runnable); running llamacpp live
      # needs APA_JUDGE_BASE_URL (D8).
      - name: Semantic gate (DeepEval, replay judge — deterministic)
        run: deepeval test run tests/evals/test_deepeval_golden.py

      # Rule regression + golden set + F10 replay (deterministic, no judge)
      - name: Rule regression + golden set
        run: pytest -q --ignore=tests/evals
