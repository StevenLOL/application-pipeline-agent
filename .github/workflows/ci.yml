# APA CI (evaluation gate)
#
# Three gates (all locally deterministic, zero external dependencies, zero
# accounts, zero network):
#   1. Semantic gate (DeepEval FaithfulnessMetric, replay judge) — catches
#      semantic-level defects that literal rules miss (JD checklist action
#      items with no JD basis). Semantic case data stays in the private
#      upstream repo (exposure discipline); this gate self-skips when the
#      case file is absent.
#   2. Rule regression (F1 engine + inheritance + A2/A4/A5 + F10 rules)
#   3. Golden set (incident version pairs + proposal-doc rule + replay)
#
# Environment: Python 3.11 (same as conda env apa, docs/09 §7).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (dev + eval extras)
        run: pip install -e ".[dev,eval]"

      # Semantic gate: deepeval CLI entrypoint (DeepEval is officially Pytest-native).
      # Exit-code semantics verified locally: all-green exits 0; a broken verdict
      # (detect-case verdicts flipped) exits 1.
      # Judge defaults to replay (deterministic, CI-runnable); running llamacpp live
      # needs APA_JUDGE_BASE_URL.
      # The semantic case file stays private (exposure discipline); the gate
      # self-skips when it is not shipped, instead of failing on a missing path.
      - name: Semantic gate (DeepEval, replay judge — deterministic)
        run: |
          if [ -f tests/evals/test_deepeval_golden.py ]; then
            deepeval test run tests/evals/test_deepeval_golden.py
          else
            echo "Semantic gate cases not shipped in this repo (exposure discipline) — skipped."
          fi

      # Rule regression + golden set + F10 replay (deterministic, no judge)
      - name: Rule regression + golden set
        run: pytest -q --ignore=tests/evals
