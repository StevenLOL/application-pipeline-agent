[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apa"
version = "0.1.0"
description = "Application Pipeline Agent - governed document-intake & compliance agent for the job-application pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
eval = ["deepeval>=4.3.1"]

[project.scripts]
apa = "apa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "deepeval: DeepEval semantic gate (D6/F4; replay judge is deterministic by default; llamacpp needs an endpoint)",
    "slow: slow test cases (CI can schedule them separately)",
]
